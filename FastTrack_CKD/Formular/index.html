<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../site.webmanifest" />

    <title>Bitte Ausfüllen</title>

    <!-- CSS einbinden -->
    <link rel="stylesheet" href="../../Lipid/styles.css" />
    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body>
    <header class="header">
      <h1>Bitte Ausfüllen</h1>
    </header>
    <form>
      <label class="checkbox-container">
        <input type="checkbox" id="option1" />
        <span>Haben Sie Atemnot?</span>
      </label>
      <label class="checkbox-container">
        <input type="checkbox" id="option2" />
        <span>Haben Sie geschwollene Beine?</span>
      </label>
      <label class="checkbox-container">
        <input type="checkbox" id="option3" />
        <span>Haben Sie Blut im Urin bemerkt?</span>
      </label>
      <label class="checkbox-container">
        <input type="checkbox" id="option4" />
        <span>Haben Sie aktuell Brennen beim Wasserlassen?</span>
      </label>
      <label class="checkbox-container">
        <input type="checkbox" id="option5" />
        <span>Ist Bluthochdruck bekannt?</span>
      </label>
      <div class="umrechner last-input-centered last-input-centered2">
        <label>
          <span>Seit wann?</span>
        </label>

        <div class="eingabefeld">
          <label class="einheit-label">Jahr</label>

          <input id="jahrblut" type="number" step="1" min="18" />
        </div>
      </div>
      <label class="checkbox-container">
        <input type="checkbox" id="option6" />
        <span>Messen Sie selber?</span>
      </label>
      <div class="umrechner last-input-centered last-input-centered2">
        <label>
          <span>Wie hoch ist der obere Wert <br />zu Hause?</span>
        </label>

        <div class="eingabefeld">
          <label class="einheit-label">mmHg</label>

          <input id="obererWert" type="number" step="1" min="18" />
        </div>
      </div>
    </form>
    <script src="../script.js"></script>
  </body>
</html>
