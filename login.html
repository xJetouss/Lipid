<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lipids – Login</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth.js" defer></script>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1 !important;
        padding: 20px;
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        padding: 34px 30px;
        box-shadow:
          0 3px 6px rgba(0, 0, 0, 0.05),
          0 12px 30px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(10px);
      }

      .login-card h1 {
        text-align: center;
        margin: 0 0 26px 0;
        font-size: 2rem;
        color: #005fa3;
      }

      .login-card label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #4a5a6a;
        margin: 14px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.8);
        box-sizing: border-box;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        font-family: inherit;
      }

      .login-card input:focus {
        border-color: #0077cc;
        box-shadow: 0 0 0 3px rgba(0, 119, 204, 0.15);
      }

      /* ============================
       Passwort mit Auge
       ============================ */
      .password-wrapper {
        position: relative;
        width: 100%;
      }

      .password-wrapper input {
        padding-right: 46px; /* Platz fürs Auge */
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        border-radius: 10px;
        color: #4a5a6a;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .password-toggle:hover {
        background: rgba(0, 119, 204, 0.08);
        color: #005fa3;
      }

      .password-toggle svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
        pointer-events: none;
      }

      /* ============================ */

      .btn-primary,
      .btn-ghost {
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.25s ease;
        margin-top: 18px;
      }

      .btn-primary {
        background: linear-gradient(90deg, #005fa3, #0095ff);
        color: white;
        box-shadow: 0 6px 14px rgba(0, 95, 163, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 95, 163, 0.35);
      }

      .btn-ghost {
        background: transparent;
        color: #005fa3;
        border: 2px solid #005fa3;
        margin-top: 10px;
      }

      .btn-ghost:hover {
        background: rgba(0, 95, 163, 0.08);
      }

      #login-msg {
        text-align: center;
        margin-top: 14px;
        font-size: 0.95rem;
        min-height: 1.2em;
      }

      .error {
        color: #dc2626;
      }
      .success {
        color: #16a34a;
      }

      .hint {
        text-align: center;
        font-size: 0.85rem;
        color: #6b7280;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Lipids</h1>

      <form id="loginForm">
        <label for="username">Benutzername</label>
        <input id="username" type="text" autocomplete="username" required />

        <label for="password">Passwort</label>
        <div class="password-wrapper">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            title="Passwort anzeigen"
            aria-label="Passwort anzeigen"
          >
            <!-- Auge OFFEN (Passwort sichtbar) -->
            <svg
              id="eyeOpen"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              style="display: none"
            >
              <path
                d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z"
              />
            </svg>

            <!-- Auge ZU (Passwort versteckt) -->
            <svg
              id="eyeClosed"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
            >
              <path
                d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z"
              />
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-primary">Einloggen</button>
      </form>

      <button type="button" class="btn-ghost" id="guestBtn">
        Als Gast fortfahren
      </button>

      <div id="login-msg"></div>
      <div class="hint">Gäste haben nur Zugriff auf die Hauptseite.</div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Falls schon eingeloggt → direkt weiter
        if (isLoggedIn() || isGuest()) {
          window.location.href = "index.html";
          return;
        }

        const form = document.getElementById("loginForm");
        const msg = document.getElementById("login-msg");

        // ---------- Passwort-Auge ----------
        const pwdInput = document.getElementById("password");
        const toggleBtn = document.getElementById("togglePassword");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        toggleBtn.addEventListener("click", () => {
          const isHidden = pwdInput.type === "password";
          pwdInput.type = isHidden ? "text" : "password";

          // Icon tauschen
          eyeOpen.style.display = isHidden ? "block" : "none";
          eyeClosed.style.display = isHidden ? "none" : "block";

          // Tooltip aktualisieren
          toggleBtn.title = isHidden
            ? "Passwort verbergen"
            : "Passwort anzeigen";
          toggleBtn.setAttribute(
            "aria-label",
            isHidden ? "Passwort verbergen" : "Passwort anzeigen",
          );

          // Cursor ans Ende setzen
          const len = pwdInput.value.length;
          pwdInput.focus();
          try {
            pwdInput.setSelectionRange(len, len);
          } catch {}
        });

        // ---------- Login ----------
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const u = document.getElementById("username").value.trim();
          const p = pwdInput.value;

          msg.className = "";
          msg.textContent = "Einloggen...";

          try {
            await loginUser(u, p);
            msg.className = "success";
            msg.textContent = "Erfolgreich eingeloggt.";
            setTimeout(() => (window.location.href = "index.html"), 400);
          } catch (err) {
            msg.className = "error";
            msg.textContent = err.message;
          }
        });

        // ---------- Gast ----------
        document
          .getElementById("guestBtn")
          .addEventListener("click", loginAsGuest);
      });
    </script>
  </body>
</html>
