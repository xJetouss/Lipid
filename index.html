<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lipid</title>
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="favicon-32x32.png"
        />
        <link rel="manifest" href="site.webmanifest" />
        <!-- Startseite: leitet auf Formular 1 weiter (ohne Sitzung → Login) -->
        <script>
            (function () {
                var target = "formular1/";
                try {
                    if (
                        localStorage.getItem("is_guest") !== "true" &&
                        !localStorage.getItem("access_token")
                    )
                        target = "login.html";
                } catch (e) {}
                location.replace(target);
            })();
        </script>
        <noscript
            ><meta http-equiv="refresh" content="0; url=formular1/"
        /></noscript>
    </head>
    <body>
        <a href="formular1/index.html">Weiter zu Formular 1</a>
    </body>
</html>
